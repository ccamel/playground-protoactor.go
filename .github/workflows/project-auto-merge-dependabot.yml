name: Project / Auto Merge Dependabot

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-auto-merge-dependabot:
    runs-on: ubuntu-22.04
    steps:
      - name: Auto merge PR
        uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          target: minor
          approve: true
          github-token: ${{ secrets.AUTOMERGE_TOKEN }}
